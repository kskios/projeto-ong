<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Mãos que Transformam</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Mãos que Transformam</h1>

        <nav>
            <ul>
                <li>
                    <a href="index.html">Início</a>
                </li>

                <li>
                    <a href="projetos.html">Projetos</a>
                </li>

                <li>
                    <a href="cadastro.html">Cadastro</a>
                </li>
            </ul>
        </nav>
    </header>

    <main>

        <section>
            <h2>Cadastro de Voluntário</h2>

            <p>
                Preencha seus dados para fazer parte das ações
                voluntárias da Mãos que Transformam.
            </p>

            <form id="cadastroForm">

                <!-- DADOS PESSOAIS -->
                <fieldset>

                    <legend>Dados pessoais</legend>

                    <label for="nome">
                        Nome completo:
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        required
                        minlength="3"
                        autocomplete="name"
                    >

                    <label for="dataNascimento">
                        Data de nascimento:
                    </label>

                    <input
                        type="text"
                        id="dataNascimento"
                        name="dataNascimento"
                        placeholder="DD/MM/AAAA"
                        maxlength="10"
                        pattern="\d{2}/\d{2}/\d{4}"
                        required
                        autocomplete="bday"
                    >

                    <label for="cpf">
                        CPF:
                    </label>

                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        placeholder="000.000.000-00"
                        maxlength="14"
                        pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
                        required
                        inputmode="numeric"
                        autocomplete="off"
                    >

                </fieldset>


                <!-- CONTATO -->
                <fieldset>

                    <legend>Contato</legend>

                    <label for="email">
                        E-mail:
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="seuemail@exemplo.com"
                        required
                        autocomplete="email"
                    >

                    <label for="telefone">
                        Telefone:
                    </label>

                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        placeholder="(11) 99999-9999"
                        maxlength="15"
                        pattern="\(\d{2}\) \d{5}-\d{4}"
                        required
                        inputmode="numeric"
                        autocomplete="tel"
                    >

                </fieldset>


                <!-- ENDEREÇO -->
                <fieldset>

                    <legend>Endereço</legend>

                    <label for="endereco">
                        Endereço:
                    </label>

                    <input
                        type="text"
                        id="endereco"
                        name="endereco"
                        placeholder="Rua, número e complemento"
                        required
                    >

                    <label for="cep">
                        CEP:
                    </label>

                    <input
                        type="text"
                        id="cep"
                        name="cep"
                        placeholder="00000-000"
                        maxlength="9"
                        pattern="\d{5}-\d{3}"
                        required
                        inputmode="numeric"
                        autocomplete="postal-code"
                    >

                </fieldset>


                <button type="submit">
                    Enviar cadastro
                </button>

            </form>

        </section>

    </main>

    <footer>

        <p>
            &copy; 2026 Mãos que Transformam.
            Todos os direitos reservados.
        </p>

    </footer>

    <script src="js/script.js"></script>

</body>

</html>
